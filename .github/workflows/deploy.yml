# Every push to main: build the app and push it to the `deploy` branch
# (same as running `npm run deploy`). Then, to put it live, in
# cPanel → Terminal: cd ~/repositories/appointment && git pull && bash deploy.sh
name: Build for cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so deploy-branch pushes never race.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public by design: both ship to every visitor's browser; RLS protects
      # the data. Never put SUPABASE_DB_URL, ADMIN_PASSWORD or TEACHER_PIN here.
      VITE_SUPABASE_URL: https://mxwfuadpkavtfcaqjokx.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable__cRA7jbRNUqhSr47290oWw_WULEX-rB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: npm run deploy
